trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
  IMAGE_TAG: latest

steps:

# =========================
# Build & Push Backend
# =========================

- task: Docker@2
  displayName: Build and Push Backend
  inputs:
    command: buildAndPush
    repository: backend
    dockerfile: backend/Dockerfile
    containerRegistry: techwithdiwana-serviceconnection
    tags: |
      $(IMAGE_TAG)

# =========================
# Build & Push Frontend
# =========================

- task: Docker@2
  displayName: Build and Push Frontend
  inputs:
    command: buildAndPush
    repository: frontend
    dockerfile: frontend/Dockerfile
    containerRegistry: techwithdiwana-serviceconnection
    tags: |
      $(IMAGE_TAG)

# =========================
# Install kubectl
# =========================

- task: KubectlInstaller@0
  displayName: Install kubectl
  inputs:
    kubectlVersion: latest

# =========================
# Login to Azure + AKS
# =========================

- task: AzureCLI@2
  displayName: Login to AKS
  inputs:
    azureSubscription: Azure Resource Manager
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |
      az aks get-credentials \
      --resource-group aks-free-rg \
      --name free-aks \
      --overwrite-existing

# =========================
# Deploy Backend
# =========================

- script: |
    kubectl set image deployment/backend-deployment \
    backend=techwithdiwana.azurecr.io/backend:latest

  displayName: Deploy Backend

# =========================
# Deploy Frontend
# =========================

- script: |
    kubectl set image deployment/frontend-deployment \
    frontend=techwithdiwana.azurecr.io/frontend:latest

  displayName: Deploy Frontend

# =========================
# Verify Deployment
# =========================

- script: |
    kubectl get pods
    kubectl get svc
    kubectl get ingress

  displayName: Verify AKS Deployment