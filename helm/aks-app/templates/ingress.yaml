apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: aks-ingress

spec:
  ingressClassName: nginx

  rules:
  - host: ""

    http:
      paths:

      # Frontend
      - path: /
        pathType: Prefix

        backend:
          service:
            name: frontend-service

            port:
              number: 80

      # Backend
      - path: /api
        pathType: Prefix

        backend:
          service:
            name: backend-service

            port:
              number: 3000